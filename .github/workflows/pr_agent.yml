name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Qodo
    steps:
      - name: The PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "deepseek/deepseek-v4-flash"
          config.fallback_models: '["deepseek/deepseek-v4-pro"]'
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_reviewer.num_max_findings: "100"
          pr_code_suggestions.num_code_suggestions_per_chunk: "5"
          pr_code_suggestions.commitable_code_suggestions: "true"
